services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: laundrypos
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: laundry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://laundry:laundry@db:5432/laundrypos?schema=public
      JWT_SECRET: supersecret
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - "5173:80"

volumes:
  postgres_data:
